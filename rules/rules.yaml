# Statutory values, rates, due dates, thresholds for LedgerGraph
# Note: Statutory values must never be hardcoded in Python code.

statutory:
  gst_rates: [0, 5, 12, 18, 28]
  fy_start_month: 4 # April
  fy_end_month: 3 # March

validation:
  confidence_threshold: 0.85
  tolerance_rupees: 1.0 # Round-off tolerance

rules:
  rule_37:
    statutory_days: 180
    warning_days: 150
    alert_days: [120, 150, 170]
  rule_37a:
    reversal_cut_off_month: 11 # 30th November of subsequent FY
    reversal_cut_off_day: 30

chase:
  max_chases_per_issue: 3
  cooldown_days: 3
  opt_out_keywords: ["STOP", "UNSUBSCRIBE", "HALT"]
  message_costs_inr:
    utility: 0.35
    marketing: 0.85
    authentication: 0.25

