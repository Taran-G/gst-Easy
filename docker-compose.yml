services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: ledgergraph_falkordb
    ports:
      - "${FALKORDB_PORT:-6380}:6379"
    volumes:
      - falkordb_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ledgergraph_redis
    ports:
      - "${REDIS_PORT:-6389}:6379"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: ledgergraph_api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - MODE=${MODE:-mock}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-for-ledgergraph-production-ca-firm-2026}
      - DATA_DIR=/data/files
      - FIXTURES_DIR=/app/fixtures
      - RULES_PATH=/app/rules/rules.yaml
    volumes:
      - api_data:/data/files
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: ledgergraph_web
    ports:
      - "${WEB_PORT:-3002}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:${API_PORT:-8000}/api/v1
    depends_on:
      - api
    restart: unless-stopped

volumes:
  falkordb_data:
  api_data:
